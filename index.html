<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E2841"><title>KaushalSetu: capability pathway for construction workmen (prototype)</title>
<style>
/* KaushalSetu prototype — tokens extracted from the pitch deck (hex from slide XML, fonts: Poppins headings, Calibri body) */
:root{
 --navy:#0E2841; --orange:#E97132; --teal:#156082; --green:#196B24; --sky:#0F9ED5; --grey:#8A8A8A; --grey2:#757575;
 --paper:#F6F6F6; --peach:#FCEEE3; --sand:#FDF3E2; --mint:#EAF6EC; --line:#CECECE; --white:#fff; --red:#B3261E; --redbg:#FBEAE8;
 --l1:#156082; --l2:#B84E12; --l3:#196B24;           /* three verification layers: teal / burnt-orange / green */
 --head:Poppins,'Segoe UI',Roboto,'Noto Sans Devanagari','Nirmala UI',Mangal,system-ui,sans-serif;
 --body:Calibri,Carlito,'Segoe UI',Roboto,'Noto Sans Devanagari','Nirmala UI',Mangal,system-ui,sans-serif;
 --bw:2px; --r:16px; --fs:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#E9EDF1;color:var(--navy);font:400 var(--fs)/1.5 var(--body);-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--head);margin:0 0 .4em;line-height:1.25;color:var(--navy)}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.08rem}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--sky);outline-offset:2px}
.app{max-width:680px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:150px;box-shadow:0 0 40px rgba(14,40,65,.12)}
.pad{padding:14px}
/* header */
.top{background:var(--navy);color:#fff;padding:10px 14px 10px;position:sticky;top:0;z-index:20}
.top .r1,.top .r2{display:flex;align-items:center;gap:8px;justify-content:space-between}
.top .r2{margin-top:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font:700 1.25rem var(--head);letter-spacing:.2px}
.brand small{font:500 .7rem var(--body);opacity:.8;display:block;letter-spacing:.3px}
.brand svg{width:38px;height:24px}
.iconbtn{min-width:48px;min-height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:1.25rem}
.seg{display:inline-flex;border:2px solid rgba(255,255,255,.55);border-radius:12px;overflow:hidden}
.seg button{min-height:46px;min-width:56px;padding:0 10px;background:transparent;border:0;color:#fff;font-weight:700}
.seg button[aria-pressed=true]{background:var(--orange);color:var(--navy)}
.netchip{min-height:46px;border-radius:12px;border:2px solid rgba(255,255,255,.55);background:transparent;color:#fff;padding:0 12px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.netchip.off{background:#fff;color:var(--navy);border-color:#fff}
.badge-q{background:var(--orange);color:var(--navy);border-radius:99px;padding:0 8px;font-size:.85rem;font-weight:800}
/* persona bar */
.persona{display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto;background:var(--sand);border-bottom:2px solid #F0DFC0}
.persona .lbl{font-size:.75rem;font-weight:700;color:var(--grey2);align-self:center;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px}
.pbtn{flex:0 0 auto;min-height:48px;padding:0 12px;border-radius:12px;border:2px solid var(--navy);background:#fff;font-weight:700;font-size:.92rem;white-space:nowrap}
.pbtn[aria-pressed=true]{background:var(--navy);color:#fff}
.who{padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:2px solid var(--line)}
.who b{font-family:var(--head)}
/* cards / buttons */
.card{background:#fff;border:var(--bw) solid var(--line);border-radius:var(--r);padding:14px;margin:12px 14px}
.card.flat{margin:0;padding:12px}
.card.hi{border-color:var(--orange);background:var(--peach)}
.card.ok{border-color:var(--green);background:var(--mint)}
.card.bad{border-color:var(--red);background:var(--redbg)}
.card.info{border-color:var(--teal);background:#EAF3F8}
.btn{min-height:56px;padding:10px 18px;border-radius:14px;border:3px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.25}
.btn.primary{background:var(--orange);color:var(--navy)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:48px;padding:6px 12px;font-size:.92rem}
.btn.lock{background:repeating-linear-gradient(45deg,#f0f0f0,#f0f0f0 8px,#e4e4e4 8px,#e4e4e4 16px);color:#555;border-color:#8a8a8a;border-style:dashed}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--grey2);font-size:.9rem}
.tiny{font-size:.78rem;color:var(--grey2)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:700;border:2px solid var(--line);background:#fff;white-space:nowrap}
.chip.sim{background:var(--sand);border-color:#E3C48A;color:#7A4A00}
.chip.real{background:var(--mint);border-color:#9CCBA3;color:var(--green)}
.chip.fut{background:#EEE;border-color:#BBB;color:#444}
.chip.lv{background:var(--navy);color:#fff;border-color:var(--navy)}
.src{display:inline-block;font-size:.72rem;color:var(--teal);background:#EAF3F8;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:3px solid var(--navy);padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar .in{max-width:680px;margin:0 auto;display:flex;gap:4px;padding:6px}
.tab{flex:1;min-height:64px;border:2px solid transparent;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;color:var(--navy);gap:2px}
.tab .ic{font-size:1.5rem;line-height:1}
.tab[aria-current=page]{background:var(--navy);color:#fff}
.tab.primary{flex:1.5;background:var(--peach);border-color:var(--orange)}
.tab.primary[aria-current=page]{background:var(--orange);color:var(--navy)}
.tab.support{flex:1}
.actionbar{position:fixed;left:0;right:0;bottom:82px;z-index:25;padding:8px 14px;background:linear-gradient(to top,var(--paper) 70%,rgba(246,246,246,0))}
.actionbar .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.actionbar .btn{flex:1}
/* loop tracker (deck chevron palette) */
.loop{display:flex;gap:3px;padding:0 14px;overflow-x:auto}
.loop .st{flex:1 0 82px;min-height:54px;color:#fff;font:700 .68rem var(--head);display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 8px 4px 14px;clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,10% 50%);opacity:.42}
.loop .st.done{opacity:1}
.loop .st.cur{opacity:1;outline:0;filter:drop-shadow(0 0 0 #000);box-shadow:none;transform:scale(1.04)}
.loop .st{position:relative}
.pillars{display:flex;gap:8px;margin:0 14px 10px;align-items:stretch}
.pillar{border-radius:14px;padding:10px 12px;border:2px solid var(--line);background:#fff;font-size:.85rem}
.pillar.main{flex:2;background:var(--peach);border-color:var(--orange)}
.pillar.side{flex:1}
/* module cards / layers */
.mod{display:block;width:100%;text-align:left;background:#fff;border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 10px}
.mod.locked{background:#f2f2f2}
.layers{display:flex;gap:6px;margin-top:8px}
.ly{flex:1;border-radius:10px;padding:5px 6px;font-size:.72rem;font-weight:700;text-align:center;border:2px solid var(--line);background:#fff;color:#555;line-height:1.2}
.ly .i{display:block;font-size:1.15rem}
.ly.l1.on{background:var(--l1);color:#fff;border-color:var(--l1);border-radius:99px}
.ly.l2.on{background:var(--l2);color:#fff;border-color:var(--l2);border-radius:6px}
.ly.l3.on{background:var(--l3);color:#fff;border-color:var(--l3);border-radius:14px 14px 4px 4px}
.ly.wait{border-style:dashed;border-color:var(--l3);color:var(--l3)}
.ly.prac{border-color:var(--red);color:var(--red)}
.ly.rpl{background:var(--sand);border-color:#E3C48A;color:#7A4A00}
.prog{height:12px;background:#E3E3E3;border-radius:8px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--sky)}
/* module screen */
.hero{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;border-radius:var(--r);margin:12px 14px;padding:14px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:22px 22px}
.hero>*{position:relative}
.hero h2{color:#fff}
.laytabs{display:flex;gap:6px;margin:0 14px 8px}
.laytab{flex:1;min-height:60px;border:3px solid var(--line);background:#fff;border-radius:12px;font-weight:700;font-size:.8rem;padding:4px;line-height:1.2}
.laytab .i{display:block;font-size:1.2rem}
.laytab[aria-selected=true]{border-color:var(--navy);box-shadow:0 3px 0 var(--navy)}
.laytab.l1{border-radius:99px}.laytab.l2{border-radius:8px}.laytab.l3{border-radius:16px 16px 6px 6px}
.laytab.done.l1{background:var(--l1);color:#fff;border-color:var(--l1)}
.laytab.done.l2{background:var(--l2);color:#fff;border-color:var(--l2)}
.laytab.done.l3{background:var(--l3);color:#fff;border-color:var(--l3)}
.laytab.lockd{background:#eee;color:#666;border-style:dashed}
.stepbox{background:#fff;border:var(--bw) solid var(--line);border-radius:var(--r);margin:0 14px;padding:14px}
.stepbig{font-size:3rem;text-align:center;line-height:1.1}
.steptext{font-size:1.28rem;line-height:1.45;font-weight:600}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:14px;height:14px;border-radius:50%;background:#ddd;border:2px solid #bbb}
.dots i.on{background:var(--sky);border-color:var(--teal)}.dots i.cur{background:var(--orange);border-color:var(--navy)}
svg.dia{width:100%;height:auto;background:#EAF3F8;border-radius:12px;border:2px solid #C9DDE8;margin:8px 0}
.warn{background:var(--sand);border-left:8px solid var(--orange);border-radius:10px;padding:10px 12px;margin-top:10px;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:60px;padding:10px 12px;border:3px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;font-size:1.02rem}
.opt .k{flex:0 0 32px;height:32px;border-radius:50%;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.opt[aria-pressed=true]{border-color:var(--navy);background:#EAF3F8}
.opt[aria-pressed=true] .k{background:var(--navy);color:#fff}
.opt.right{border-color:var(--green);background:var(--mint)}
.opt.wrongp{border-color:var(--red);background:var(--redbg)}
.q{margin-bottom:16px}
.q h3{font-size:1.05rem}
/* fields */
label.f{display:block;font-weight:700;margin:14px 0 6px}
input[type=text],textarea,select{width:100%;min-height:56px;padding:10px 12px;font:inherit;border:3px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy)}
textarea{min-height:110px}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice .opt{flex:1 1 140px;justify-content:center;margin:0;text-align:center;align-items:center}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .btn{min-width:60px}
.stepper output{font:700 1.6rem var(--head);min-width:50px;text-align:center}
.err{color:var(--red);font-weight:700;margin-top:6px}
.tick{display:flex;gap:10px;align-items:center;min-height:56px;padding:8px 12px;border:3px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff;width:100%;text-align:left}
.tick[aria-pressed=true]{border-color:var(--navy);background:#EAF3F8}
.tick .bx{width:28px;height:28px;border:3px solid var(--navy);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 28px}
/* tips */
.tip{border:var(--bw) solid var(--line);border-radius:var(--r);padding:12px;background:#fff;margin-bottom:10px}
.tip .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
/* passport */
.pp{background:linear-gradient(135deg,var(--navy) 0%,var(--teal) 100%);color:#fff;border-radius:var(--r);margin:12px 14px;padding:16px}
.pp h2,.pp h3{color:#fff}
.pp .id{font:600 .8rem var(--head);opacity:.85;letter-spacing:1px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{background:var(--navy);color:#fff;font-family:var(--head);font-size:.78rem}
.tscroll{overflow-x:auto}
/* match */
.mbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#E3E3E3}
.mbar i{display:block;height:100%}
.pct{font:800 1.6rem var(--head)}
/* bars */
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.85rem}
.bar .t{flex:0 0 120px}
.bar .b{flex:1;height:18px;background:#E3E3E3;border-radius:6px;overflow:hidden;display:flex}
.bar .b i{display:block;height:100%}
.bar .n{flex:0 0 32px;text-align:right;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px}
.kpi b{font:800 1.5rem var(--head);display:block}
/* toast / modal */
#toast{position:fixed;top:12px;left:50%;transform:translate(-50%,-140%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;z-index:99;max-width:92vw;font-weight:700;transition:transform .25s;border:3px solid var(--orange)}
#toast.on{transform:translate(-50%,0)}
.modalbg{position:fixed;inset:0;background:rgba(14,40,65,.7);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:22px 22px 0 0;max-width:680px;width:100%;padding:18px;max-height:90vh;overflow:auto;border-top:6px solid var(--red)}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.wave i{width:4px;background:var(--orange);animation:w 0.8s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}
@keyframes w{0%,100%{height:5px}50%{height:18px}}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
details{margin-top:8px}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px}
.subtabs button{flex:0 0 auto;min-height:48px;padding:0 14px;border-radius:12px;border:2px solid var(--navy);background:#fff;font-weight:700}
.subtabs button[aria-pressed=true]{background:var(--navy);color:#fff}
img.ev{max-width:100%;border-radius:12px;border:2px solid var(--line);margin-top:8px}
/* sunlight mode: real contrast/size change, not a label */
body.hc{--fs:20px;--bw:3px;--line:#000;--paper:#fff;--grey2:#222;background:#fff;color:#000}
body.hc .app{box-shadow:none}
body.hc h1,body.hc h2,body.hc h3,body.hc h4,body.hc .pct{color:#000}
body.hc .top{background:#000}
body.hc .btn{border-width:4px;border-color:#000}
body.hc .btn.primary,body.hc .seg button[aria-pressed=true]{background:#FFD400;color:#000}
body.hc .btn.navy,body.hc .pbtn[aria-pressed=true],body.hc .tab[aria-current=page]{background:#000;color:#FFD400}
body.hc .btn.green{background:#005A12;border-color:#000}
body.hc .card,body.hc .mod,body.hc .opt,body.hc .tip,body.hc .kpi,body.hc .tick{border-color:#000}
body.hc .hero,body.hc .pp{background:#000}
body.hc .chip{border-color:#000}
body.hc .muted,body.hc .tiny{color:#222}
body.hc .warn{background:#FFF3B0;border-left-color:#000}
body.hc .src{background:#fff;border:1px solid #000;color:#000}
@media (max-width:420px){:root{--fs:17px}.brand small{display:none}}
.sr{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:8px;z-index:100}
.hero .chip{color:var(--navy);border-color:#fff}
body.hc .hero .chip{color:#000}

const UI={

reg_err_trade:T('Please choose your trade.','कृपया अपना काम चुनें।','कृपया तुमचा ट्रेड निवडा.'),
reg_err_dist:T('Please choose where you work.','कृपया काम की जगह चुनें।','कृपया कामाचे ठिकाण निवडा.'),

  {ic:'💧',tx:T('Add clean water a little at a time and mix until it is workable, not runny.','साफ़ पानी थोड़ा-थोड़ा डालें और तब तक मिलाएँ जब तक काम करने लायक हो, पतला नहीं।','स्वच्छ पाणी थोडे-थोडे घाला आणि कामास योग्य होईपर्यंत मिसळा, पातळ नको.')},

 mistake:T('Common mistake: adding water to old, stiff mortar to “revive” it. It weakens the joint.','आम गलती: सख्त होते पुराने मसाले में पानी डालकर “फिर से चालू” करना। इससे जोड़ कमज़ोर होता है।','सामान्य चूक: घट्ट झालेल्या जुन्या मसाल्यात पाणी घालून “पुन्हा वापरणे”. त्यामुळे सांधा कमकुवत होतो.'),
 quiz:[

   why:T('Even mixing gives even strength.','बराबर मिश्रण से मज़बूती बराबर आती है।','एकसारख्या मिश्रणाने ताकद एकसारखी येते.')},
  {q:T('Mortar has started to stiffen after a long break. What do you do?','लंबे ब्रेक के बाद मसाला सख्त होने लगा है। क्या करें?','मोठ्या विश्रांतीनंतर मसाला घट्ट होऊ लागला आहे. काय कराल?'),
   o:[T('Do not use it; mix a fresh batch','इस्तेमाल न करें; नया मसाला बनाएँ','वापरू नका; नवा मसाला बनवा'),T('Add water and re-mix','पानी डालकर फिर मिलाएँ','पाणी घालून पुन्हा मिसळा'),T('Add more cement on top','ऊपर से और सीमेंट डालें','वरून आणखी सिमेंट घाला')],

  {q:T('How should cement and sand be measured?','सीमेंट और रेत कैसे नापें?','सिमेंट व वाळू कशी मोजावी?'),

   why:T('The same measure gives the same strength, batch after batch.','एक ही नाप से हर बैच की मज़बूती एक जैसी रहती है।','एकाच मापाने प्रत्येक बॅचची ताकद सारखी राहते.')}],
 check:[T('Measures with the same box in the given ratio','दिए गए अनुपात में एक ही डिब्बे से नापता है','दिलेल्या प्रमाणात एकाच डब्याने मोजतो'),T('Mixes dry, then adds water gradually','पहले सूखा मिलाता है, फिर धीरे-धीरे पानी डालता है','आधी कोरडे मिसळतो, मग हळूहळू पाणी घालतो'),T('Discards mortar that has begun to set','जमने लगा मसाला फेंक देता है','घट्ट होऊ लागलेला मसाला टाकून देतो')]},

  {ic:'💧',tx:T('Soak bricks in clean water until bubbles stop, then let the surface dry a little before laying.','ईंटों को साफ़ पानी में तब तक भिगोएँ जब तक बुलबुले बंद न हों, फिर सतह थोड़ी सूखने दें।','वीट स्वच्छ पाण्यात बुडबुडे थांबेपर्यंत भिजवा, मग पृष्ठभाग थोडा कोरडा होऊ द्या.')},
  {ic:'🧱',tx:T('Spread a full mortar bed. Lay each brick firmly and press down. Keep joints about 10 mm.','मसाले की पूरी परत बिछाएँ। हर ईंट दबाकर बैठाएँ। जोड़ लगभग 10 मिमी रखें।','मसाल्याचा पूर्ण थर पसरा. प्रत्येक वीट दाबून बसवा. सांधे सुमारे 10 मिमी ठेवा.')},
  {ic:'🔀',tx:T('Stagger the joints: a vertical joint must not sit directly above one in the course below.','जोड़ों को आगे-पीछे रखें: खड़ा जोड़ नीचे की लाइन के खड़े जोड़ के ठीक ऊपर न आए।','सांधे आड-उभे ठेवा: उभा सांधा खालच्या थराच्या उभ्या सांध्याच्या थेट वर येऊ नये.')},
  {ic:'🧹',tx:T('Fill the joints fully and clean off extra mortar before it hardens.','जोड़ पूरी तरह भरें और अतिरिक्त मसाला जमने से पहले साफ़ करें।','सांधे पूर्ण भरा आणि जास्तीचा मसाला घट्ट होण्यापूर्वी स्वच्छ करा.')}],
 mistake:T('Common mistake: empty gaps in the mortar bed or joints. Water gets in and the wall is weaker.','आम गलती: मसाले की परत या जोड़ में खाली जगह छोड़ना। पानी घुसता है और दीवार कमज़ोर होती है।','सामान्य चूक: मसाल्याच्या थरात किंवा सांध्यात रिकाम्या जागा ठेवणे. पाणी शिरते आणि भिंत कमकुवत होते.'),
 quiz:[
  {q:T('Why are vertical joints staggered?','खड़े जोड़ आगे-पीछे क्यों रखते हैं?','उभे सांधे आड-उभे का ठेवतात?'),
   o:[T('So load is shared and the wall does not split along a straight line','ताकि दीवार का भार बँटे और सीधी लाइन में न फटे','जेणेकरून भार वाटला जातो आणि भिंत सरळ रेषेत तडकत नाही'),T('It just looks nicer','देखने में अच्छा लगता है','दिसायला चांगले दिसते'),T('To use fewer bricks','कम ईंट लगे','कमी विटा लागतात')],
   why:T('Staggering ties the wall together.','आगे-पीछे जोड़ दीवार को आपस में बाँधते हैं।','आड-उभे सांधे भिंतीला एकमेकांशी बांधतात.')},
  {q:T('What is a good joint for brickwork?','ईंट की चिनाई में सही जोड़ कौन-सा है?','विटांच्या बांधकामात योग्य सांधा कोणता?'),
   o:[T('About 10 mm, full of mortar','लगभग 10 मिमी, मसाले से पूरा भरा','सुमारे 10 मिमी, मसाल्याने पूर्ण भरलेला'),T('As thick as needed to fix a crooked brick','जितना मोटा चाहिए, टेढ़ी ईंट सुधारने के लिए','वाकडी वीट सुधारण्यासाठी हवा तितका जाड'),T('No mortar in vertical joints','खड़े जोड़ में मसाला नहीं','उभ्या सांध्यात मसाला नको')],
   why:T('Thick, uneven or empty joints weaken the wall.','मोटे, ऊबड़-खाबड़ या खाली जोड़ दीवार कमज़ोर करते हैं।','जाड, असमान किंवा रिकामे सांधे भिंत कमकुवत करतात.')},
  {q:T('Why soak bricks before laying?','बिछाने से पहले ईंट क्यों भिगोते हैं?','रचण्यापूर्वी वीट का भिजवतात?'),
   o:[T('Dry bricks pull water out of the mortar and weaken the bond','सूखी ईंट मसाले का पानी खींच लेती है और पकड़ कमज़ोर होती है','कोरडी वीट मसाल्यातील पाणी शोषते आणि पकड कमकुवत होते'),T('To make bricks heavier','ईंट भारी करने के लिए','वीट जड करण्यासाठी'),T('To wash off the paint','रंग धोने के लिए','रंग धुण्यासाठी')],
   why:T('A wet brick sticks to mortar better.','भीगी ईंट मसाले से अच्छी चिपकती है।','भिजलेली वीट मसाल्याला चांगली चिकटते.')}],
 check:[T('Soaks bricks and lays on a full mortar bed','ईंट भिगोकर मसाले की पूरी परत पर लगाता है','वीट भिजवून मसाल्याच्या पूर्ण थरावर रचतो'),T('Staggers vertical joints correctly','खड़े जोड़ सही आगे-पीछे रखता है','उभे सांधे बरोबर आड-उभे ठेवतो'),T('Keeps joints even and cleans off excess mortar','जोड़ बराबर रखता है और अतिरिक्त मसाला साफ़ करता है','सांधे सारखे ठेवतो व जास्तीचा मसाला साफ करतो')]},

{id:'m4',trade:'mason',order:4,prereq:'m3',min:3,mb:5.0,ic:'📐',dia:'plumb',
 title:T('Line, level and plumb','लाइन, लेवल और साहुल','लाइन, लेव्हल आणि ओळंबा'),
 sub:T('Keep the wall straight, level and upright','दीवार को सीधा, समतल और खड़ा रखें','भिंत सरळ, सपाट आणि उभी ठेवा'),
 kw:T('line string level plumb bob spirit bubble straight vertical check corner','लाइन धागा लेवल साहुल बुलबुला सीधा खड़ा जाँच कोना','लाइन दोरा लेव्हल ओळंबा बुडबुडा सरळ उभी तपासणी कोपरा'),
 steps:[
  {ic:'📏',tx:T('Fix a string line tight at the top edge of the course. Lay each brick to touch the line, not push it.','कोर्स के ऊपरी किनारे पर धागा (लाइन) कसकर बाँधें। हर ईंट लाइन को छुए, उसे धक्का न दे।','थराच्या वरच्या कडेला दोरा (लाइन) ताणून बांधा. प्रत्येक वीट लाइनला टेकावी, तिला ढकलू नये.')},
  {ic:'⚖️',tx:T('Check the course with a spirit level: bubble in the middle means level.','स्प्रिट लेवल से जाँचें: बुलबुला बीच में हो तो सतह समतल है।','स्पिरिट लेव्हलने तपासा: बुडबुडा मध्यभागी असल्यास पृष्ठभाग सपाट.')},
  {ic:'🎯',tx:T('Check the wall is upright with a plumb bob or a level on the face. Correct it before the mortar sets.','साहुल (प्लंब बॉब) या लेवल से देखें कि दीवार सीधी खड़ी है। मसाला जमने से पहले सुधारें।','ओळंबा (प्लंब बॉब) किंवा लेव्हलने भिंत उभी आहे का ते पाहा. मसाला घट्ट होण्यापूर्वी सुधारा.')},
  {ic:'🔁',tx:T('Check often, every few courses and at corners, so errors are fixed early, not at the top.','बार-बार जाँचें, हर कुछ कोर्स पर और कोनों पर, ताकि गलती ऊपर पहुँचने से पहले ही सुधर जाए।','वारंवार तपासा, काही थरांनंतर आणि कोपऱ्यांवर, म्हणजे चूक वर पोहोचण्यापूर्वी सुधारता येते.')}],
 mistake:T('Common mistake: fixing a leaning wall with thick mortar at the top. The error stays hidden.','आम गलती: दीवार झुकी हो तो ऊपर मोटा मसाला लगाकर ठीक करना। गलती छिपी रह जाती है।','सामान्य चूक: भिंत कलली असेल तर वर जाड मसाला लावून सुधारणे. चूक लपून राहते.'),
 quiz:[
  {q:T('The bubble sits at the left end of the spirit level. What does that show?','बुलबुला स्प्रिट लेवल के बाएँ सिरे पर है। इसका मतलब?','बुडबुडा स्पिरिट लेव्हलच्या डाव्या टोकाला आहे. याचा अर्थ?'),
   o:[T('Not level: the left side is higher','समतल नहीं: बायाँ तरफ़ ऊँचा है','सपाट नाही: डावी बाजू उंच आहे'),T('Perfectly level','बिल्कुल समतल है','अगदी सपाट आहे'),T('The wall is upright','दीवार सीधी खड़ी है','भिंत उभी आहे')],
   why:T('The bubble moves toward the higher end. Adjust until it is centred.','बुलबुला ऊँचे सिरे की ओर जाता है। बीच में आने तक सुधारें।','बुडबुडा उंच टोकाकडे सरकतो. मध्यभागी येईपर्यंत सुधारा.')},
  {q:T('When should you check plumb and level?','साहुल और लेवल कब जाँचें?','ओळंबा व लेव्हल केव्हा तपासावे?'),
   o:[T('Often: every few courses and at corners, while mortar is soft','अक्सर: हर कुछ कोर्स पर और कोनों पर, जब मसाला नरम हो','वारंवार: काही थरांनंतर व कोपऱ्यांवर, मसाला मऊ असताना'),T('Only when the wall is finished','सिर्फ़ दीवार पूरी होने पर','फक्त भिंत पूर्ण झाल्यावर'),T('Only when the supervisor is watching','सिर्फ़ जब सुपरवाइज़र देख रहा हो','फक्त सुपरवायझर पाहत असेल तेव्हा')],
   why:T('An error caught early is easy to fix.','जल्दी पकड़ी गई गलती आसानी से सुधरती है।','लवकर पकडलेली चूक सहज सुधारता येते.')},
  {q:T('What is the string line used for?','धागे (लाइन) का उपयोग क्या है?','दोऱ्याचा (लाइन) उपयोग काय?'),
   o:[T('To keep each course straight and at the same height','हर कोर्स सीधा और एक ऊँचाई पर रखने के लिए','प्रत्येक थर सरळ व सारख्या उंचीवर ठेवण्यासाठी'),T('To measure mortar','मसाला नापने के लिए','मसाला मोजण्यासाठी'),T('To hold up the scaffold','पाड़ पकड़ने के लिए','पाड धरण्यासाठी')],
   why:T('Bricks laid to the line come out straight and even.','लाइन के साथ लगी ईंटें सीधी और बराबर ऊँचाई की बनती हैं।','लाइनला धरून लावलेल्या विटा सरळ व सारख्या उंचीच्या होतात.')}],
 check:[T('Sets a tight string line and lays to it','कसी हुई लाइन बाँधकर उसी पर चिनाई करता है','ताणलेली लाइन बांधून त्यावर रचतो'),T('Checks level and plumb with the tools','औज़ारों से लेवल और साहुल जाँचता है','साधनांनी लेव्हल व ओळंबा तपासतो'),T('Corrects errors before mortar sets','मसाला जमने से पहले गलती सुधारता है','मसाला घट्ट होण्यापूर्वी चूक सुधारतो')]},

{id:'b1',trade:'bender',order:1,prereq:null,min:3,mb:4.6,ic:'📋',dia:'bbs',
 title:T('Reading a bar bending schedule','बार बेंडिंग शेड्यूल पढ़ना','बार बेंडिंग शेड्यूल वाचणे'),
 sub:T('Mark, diameter, shape, length, number','मार्क, व्यास, आकार, लंबाई, संख्या','मार्क, व्यास, आकार, लांबी, संख्या'),
 kw:T('schedule bbs bar mark diameter shape length number drawing grade fe500 read','शेड्यूल बीबीएस बार मार्क व्यास आकार लंबाई संख्या ड्रॉइंग ग्रेड पढ़ना','शेड्यूल बीबीएस बार मार्क व्यास आकार लांबी संख्या ड्रॉइंग ग्रेड वाचणे'),
 steps:[
  {ic:'📋',tx:T('A bar bending schedule lists each bar: mark, diameter, shape, cut length and number of bars.','बार बेंडिंग शेड्यूल में हर सरिये का मार्क, व्यास, आकार, कटाई की लंबाई और संख्या लिखी होती है।','बार बेंडिंग शेड्यूलमध्ये प्रत्येक सळईचा मार्क, व्यास, आकार, कापण्याची लांबी व संख्या दिलेली असते.')},
  {ic:'📐',tx:T('Match each bar mark to the drawing so you know where that bar goes.','हर बार-मार्क को ड्रॉइंग से मिलाएँ ताकि पता रहे कि वह सरिया कहाँ लगेगा।','प्रत्येक बार-मार्क ड्रॉइंगशी जुळवा म्हणजे ती सळई कुठे बसते ते कळेल.')},
  {ic:'🔎',tx:T('Check the bar diameter and grade printed on the bar (for example Fe 500) before cutting.','काटने से पहले सरिये पर छपा व्यास और ग्रेड (जैसे Fe 500) जाँचें।','कापण्यापूर्वी सळईवर छापलेला व्यास व ग्रेड (उदा. Fe 500) तपासा.')},
  {ic:'🙋',tx:T('If the schedule and drawing disagree, do not guess. Ask the engineer or supervisor.','शेड्यूल और ड्रॉइंग में फ़र्क हो तो अंदाज़ा न लगाएँ। इंजीनियर या सुपरवाइज़र से पूछें।','शेड्यूल व ड्रॉइंगमध्ये फरक असेल तर अंदाज करू नका. इंजिनिअर किंवा सुपरवायझरला विचारा.')}],
 mistake:T('Common mistake: cutting bars of the wrong diameter because the size was not checked.','आम गलती: व्यास न जाँचने से गलत मोटाई के सरिये काट देना।','सामान्य चूक: व्यास न तपासल्याने चुकीच्या जाडीच्या सळया कापणे.'),
 quiz:[
  {q:T('What does a bar mark tell you?','बार-मार्क से क्या पता चलता है?','बार-मार्कवरून काय कळते?'),
   o:[T('Which bar in the drawing this is, so it is placed correctly','ड्रॉइंग में यह कौन-सा सरिया है, ताकि सही जगह लगे','ड्रॉइंगमधील ती कोणती सळई आहे, म्हणजे योग्य जागी बसते'),T('The price of the bar','सरिये की कीमत','सळईची किंमत'),T('Who made the bar','सरिया किसने बनाया','सळई कोणी बनवली')],
   why:T('The mark sends the right bar to the right place.','मार्क से सही सरिया सही जगह पहुँचता है।','मार्कमुळे योग्य सळई योग्य जागी जाते.')},
  {q:T('The schedule says 12 mm but the bar in front of you is 16 mm. You should…','शेड्यूल में 12 मिमी है पर सामने का सरिया 16 मिमी का है। आप क्या करेंगे?','शेड्यूलमध्ये 12 मिमी आहे पण समोरची सळई 16 मिमी आहे. तुम्ही काय कराल?'),
   o:[T('Stop and check with the supervisor','रुकें और सुपरवाइज़र से पूछें','थांबा आणि सुपरवायझरला विचारा'),T('Use it, thicker is stronger','इस्तेमाल करें, मोटा ज़्यादा मज़बूत है','वापरा, जाड जास्त मजबूत असते'),T('Cut it anyway','फिर भी काट दें','तरीही कापा')],
   why:T('Changing bar size changes the design. Only the engineer can approve it.','सरिये का साइज़ बदलने से डिज़ाइन बदलता है। केवल इंजीनियर मंज़ूरी दे सकता है।','सळईचा आकार बदलल्यास डिझाइन बदलते. फक्त इंजिनिअर मंजुरी देऊ शकतो.')},
  {q:T('Where do you find how many bars to cut?','कितने सरिये काटने हैं, यह कहाँ मिलेगा?','किती सळया कापायच्या ते कुठे मिळेल?'),
   o:[T('In the bar bending schedule','बार बेंडिंग शेड्यूल में','बार बेंडिंग शेड्यूलमध्ये'),T('Ask any worker nearby','पास के किसी भी मज़दूर से','जवळच्या कोणत्याही कामगाराकडून'),T('Guess from the pile','ढेर देखकर अंदाज़ से','ढिगाकडे पाहून अंदाजाने')],
   why:T('The schedule is the official count.','शेड्यूल ही आधिकारिक गिनती देता है।','शेड्यूल हीच अधिकृत मोजणी देते.')}],
 check:[T('Reads mark, diameter and length from the schedule','शेड्यूल से मार्क, व्यास और लंबाई पढ़ता है','शेड्यूलमधून मार्क, व्यास व लांबी वाचतो'),T('Matches each bar to the drawing','हर सरिये को ड्रॉइंग से मिलाता है','प्रत्येक सळई ड्रॉइंगशी जुळवतो'),T('Stops and asks when something does not match','कुछ मेल न खाए तो रुककर पूछता है','काही जुळत नसेल तर थांबून विचारतो')]},

{id:'b2',trade:'bender',order:2,prereq:'b1',min:4,mb:6.3,ic:'✂️',dia:'bend',
 title:T('Cutting and bending bars safely','सरिया सुरक्षित काटना और मोड़ना','सळई सुरक्षितपणे कापणे व वाकवणे'),
 sub:T('Gloves and eye protection, mark, cut, bend cold','दस्ताने और आँखों की सुरक्षा, निशान, कटाई, ठंडा मोड़','हातमोजे व डोळ्यांचे संरक्षण, खूण, कापणे, थंड वाकवणे'),
 kw:T('cut bend bender pin gloves eye protection cold heat shape mark tag ppe safety','काटना मोड़ना बेंडर पिन दस्ताने आँख सुरक्षा ठंडा गरम आकार निशान टैग','कापणे वाकवणे बेंडर पिन हातमोजे डोळे सुरक्षा थंड गरम आकार खूण टॅग'),
 steps:[
  {ic:'🥽',tx:T('Wear gloves, safety shoes and eye protection at the cutting and bending bench.','कटिंग और बेंडिंग टेबल पर दस्ताने, सेफ्टी जूते और आँखों की सुरक्षा पहनें।','कटिंग व बेंडिंग टेबलवर हातमोजे, सेफ्टी बूट आणि डोळ्यांचे संरक्षण घाला.')},
  {ic:'✂️',tx:T('Cut to the length in the schedule. Mark the bar first, then cut. Never guess the length by eye.','शेड्यूल की लंबाई के अनुसार काटें। पहले सरिये पर निशान लगाएँ, फिर काटें। अंदाज़े से नहीं।','शेड्यूलमधील लांबीनुसार कापा. आधी सळईवर खूण करा, मग कापा. अंदाजाने नाही.')},
  {ic:'🔧',tx:T('Bend cold, slowly, over the correct bender pin. Do not heat a bar or re-bend one that is already bent.','सही बेंडर पिन पर धीरे-धीरे ठंडा मोड़ें। सरिये को गरम न करें और मुड़े हुए सरिये को दोबारा न मोड़ें।','योग्य बेंडर पिनवर थंड, हळूहळू वाकवा. सळई गरम करू नका आणि एकदा वाकवलेली सळई पुन्हा वाकवू नका.')},
  {ic:'🏷️',tx:T('Check each bent bar against the shape in the schedule and tag it with its bar mark.','हर मुड़े सरिये को शेड्यूल के आकार से मिलाएँ और उस पर बार-मार्क का टैग लगाएँ।','प्रत्येक वाकवलेली सळई शेड्यूलमधील आकाराशी जुळवा आणि तिच्यावर बार-मार्कचा टॅग लावा.')}],
 mistake:T('Common mistake: straightening and re-bending a wrongly bent bar. It can crack the steel.','आम गलती: गलत मुड़े सरिये को सीधा करके दोबारा मोड़ना। इससे स्टील में दरार पड़ सकती है।','सामान्य चूक: चुकीची वाकलेली सळई सरळ करून पुन्हा वाकवणे. स्टीलला तडा जाऊ शकतो.'),
 quiz:[
  {crit:true,q:T('What should you wear while cutting and bending bars?','सरिया काटते-मोड़ते समय क्या पहनना चाहिए?','सळई कापताना-वाकवताना काय घालावे?'),
   o:[T('Gloves, safety shoes and eye protection','दस्ताने, सेफ्टी जूते और आँखों की सुरक्षा','हातमोजे, सेफ्टी बूट आणि डोळ्यांचे संरक्षण'),T('Only a cap','सिर्फ़ टोपी','फक्त टोपी'),T('Nothing, if you are experienced','कुछ नहीं, अगर अनुभवी हैं','काही नाही, अनुभवी असल्यास')],
   why:T('Cut ends and chips cause injuries. Experience does not remove the risk.','कटे सिरे और चिप्स चोट पहुँचाते हैं। अनुभव से जोखिम नहीं हटता।','कापलेली टोके व तुकडे इजा करतात. अनुभवाने धोका जात नाही.')},
  {q:T('A bar was bent to the wrong shape. What is the safe practice?','एक सरिया गलत आकार में मुड़ गया। सही तरीका क्या है?','एक सळई चुकीच्या आकारात वाकली. सुरक्षित पद्धत कोणती?'),
   o:[T('Set it aside and make a new correct bar','उसे अलग रखें और नया सही सरिया बनाएँ','ती बाजूला ठेवून नवीन योग्य सळई बनवा'),T('Heat it and re-bend it','गरम करके दोबारा मोड़ें','गरम करून पुन्हा वाकवा'),T('Hammer it straight and reuse it','हथौड़े से सीधा करके फिर लगाएँ','हातोड्याने सरळ करून पुन्हा वापरा')],
   why:T('Heating or re-bending can weaken or crack the steel.','गरम करने या दोबारा मोड़ने से स्टील कमज़ोर हो सकता है या फट सकता है।','गरम केल्याने किंवा पुन्हा वाकवल्याने स्टील कमकुवत होऊ शकते किंवा तडकू शकते.')},
  {q:T('Why mark the bar before cutting?','काटने से पहले निशान क्यों लगाते हैं?','कापण्यापूर्वी खूण का करतात?'),
   o:[T('So the cut length matches the schedule','ताकि कटी लंबाई शेड्यूल से मेल खाए','म्हणजे कापलेली लांबी शेड्यूलशी जुळते'),T('To make it look neat','साफ़ दिखने के लिए','नीटनेटके दिसण्यासाठी'),T('So it feels heavier','ताकि भारी लगे','म्हणजे जड वाटावे')],
   why:T('A wrong length can waste the whole bar.','गलत लंबाई से पूरा सरिया बेकार जा सकता है।','चुकीच्या लांबीमुळे पूर्ण सळई वाया जाऊ शकते.')}],
 check:[T('Wears gloves, shoes and eye protection','दस्ताने, जूते और आँखों की सुरक्षा पहनता है','हातमोजे, बूट व डोळ्यांचे संरक्षण घालतो'),T('Marks, cuts and bends to the schedule shape','निशान लगाकर शेड्यूल के आकार में काटता-मोड़ता है','खूण करून शेड्यूलच्या आकारात कापतो-वाकवतो'),T('Tags bars and sets aside wrong ones','सरियों पर टैग लगाता है और गलत वाले अलग रखता है','सळयांवर टॅग लावतो व चुकीच्या बाजूला ठेवतो')]},

{id:'b3',trade:'bender',order:3,prereq:'b2',min:3,mb:5.2,ic:'🔲',dia:'cover',
 title:T('Cover blocks and bar spacing','कवर ब्लॉक और सरियों की दूरी','कव्हर ब्लॉक व सळ्यांचे अंतर'),
 sub:T('Keep steel inside the concrete, at the right spacing','स्टील को कंक्रीट के भीतर, सही दूरी पर रखें','स्टील काँक्रीटच्या आत, योग्य अंतरावर ठेवा'),
 kw:T('cover block spacing shuttering rust concrete tape distance sag','कवर ब्लॉक दूरी शटरिंग जंग कंक्रीट फीता झुकना','कव्हर ब्लॉक अंतर शटरिंग गंज काँक्रीट फीत झुकणे'),
 steps:[
  {ic:'🧱',tx:T('Cover is the concrete layer between the bar and the outside face. It protects steel from rust and fire. The drawing gives the cover.','कवर सरिये और बाहरी सतह के बीच की कंक्रीट की परत है। यह स्टील को जंग और आग से बचाती है। कवर ड्रॉइंग में दिया होता है।','कव्हर म्हणजे सळई व बाहेरील पृष्ठभाग यांमधील काँक्रीटचा थर. तो स्टीलला गंज व आगीपासून वाचवतो. कव्हर ड्रॉइंगमध्ये दिलेले असते.')},
  {ic:'🔲',tx:T('Use cover blocks of the right thickness under and beside the bars. Never use bricks or stones.','सरियों के नीचे और बगल में सही मोटाई के कवर ब्लॉक लगाएँ। ईंट या पत्थर नहीं।','सळ्यांच्या खाली व बाजूला योग्य जाडीचे कव्हर ब्लॉक लावा. वीट किंवा दगड नको.')},
  {ic:'↔️',tx:T('Space the bars as shown on the drawing. Check with a tape at several places.','सरियों की दूरी ड्रॉइंग के अनुसार रखें। कई जगह फ़ीते से नापकर जाँचें।','सळ्यांचे अंतर ड्रॉइंगनुसार ठेवा. अनेक ठिकाणी फितीने मोजून तपासा.')},
  {ic:'🚫',tx:T('No bar should touch the shuttering. Place blocks close enough that bars do not sag.','कोई सरिया शटरिंग को न छुए। ब्लॉक इतने पास लगाएँ कि सरिये झुकें नहीं।','कोणतीही सळई शटरिंगला टेकू नये. सळया झुकू नयेत इतके जवळ ब्लॉक लावा.')}],
 mistake:T('Common mistake: bars resting on the shuttering. Later the steel is exposed and rusts.','आम गलती: सरिये शटरिंग पर टिके रहना। बाद में स्टील खुला होकर जंग खाता है।','सामान्य चूक: सळया शटरिंगवर टेकलेल्या असणे. नंतर स्टील उघडे पडून गंजते.'),
 quiz:[
  {q:T('What is concrete cover for?','कंक्रीट कवर किसलिए है?','काँक्रीट कव्हर कशासाठी?'),
   o:[T('To protect the steel from rust and fire','स्टील को जंग और आग से बचाने के लिए','स्टीलला गंज व आगीपासून वाचवण्यासाठी'),T('To make the slab look thick','स्लैब मोटा दिखाने के लिए','स्लॅब जाड दिसण्यासाठी'),T('To save concrete','कंक्रीट बचाने के लिए','काँक्रीट वाचवण्यासाठी')],
   why:T('With too little cover, steel rusts early.','कवर कम हो तो स्टील जल्दी जंग खाता है।','कव्हर कमी असल्यास स्टील लवकर गंजते.')},
  {q:T('What holds bars off the shuttering correctly?','सरियों को शटरिंग से ऊपर सही तरीके से क्या रखता है?','सळ्यांना शटरिंगपासून योग्य पद्धतीने वर काय ठेवते?'),
   o:[T('Cover blocks of the thickness in the drawing','ड्रॉइंग में दी मोटाई वाले कवर ब्लॉक','ड्रॉइंगमध्ये दिलेल्या जाडीचे कव्हर ब्लॉक'),T('Broken bricks','टूटी ईंटें','तुटलेल्या विटा'),T('Small stones','छोटे पत्थर','छोटे दगड')],
   why:T('Bricks and stones soak up water and their thickness varies.','ईंट-पत्थर नमी सोखते हैं और मोटाई एक-सी नहीं रहती।','वीट-दगड ओलावा शोषतात आणि जाडी सारखी राहत नाही.')},
  {q:T('The drawing says 40 mm cover. What do you use?','ड्रॉइंग में कवर 40 मिमी लिखा है, तो क्या लगाएँगे?','ड्रॉइंगमध्ये कव्हर 40 मिमी आहे, तर काय लावाल?'),
   o:[T('40 mm blocks','40 मिमी के ब्लॉक','40 मिमीचे ब्लॉक'),T('Whatever is at hand','जो हाथ में हो','जे हाताशी असेल ते'),T('20 mm to save material','सामग्री बचाने के लिए 20 मिमी','सामग्री वाचवण्यासाठी 20 मिमी')],
   why:T('Always keep the cover the drawing gives.','कवर हमेशा ड्रॉइंग के अनुसार रखें।','कव्हर नेहमी ड्रॉइंगनुसार ठेवा.')}],
 check:[T('Uses correct cover blocks, never brick or stone','सही कवर ब्लॉक लगाता है, ईंट या पत्थर नहीं','योग्य कव्हर ब्लॉक लावतो, वीट किंवा दगड नाही'),T('Spaces bars as per drawing, checked with a tape','ड्रॉइंग के अनुसार दूरी रखता है, फ़ीते से जाँचता है','ड्रॉइंगनुसार अंतर ठेवतो, फितीने तपासतो'),T('No bar touches the shuttering','कोई सरिया शटरिंग को नहीं छूता','कोणतीही सळई शटरिंगला टेकत नाही')]},

{id:'b4',trade:'bender',order:4,prereq:'b3',min:4,mb:6.0,ic:'🔗',dia:'tie',
 title:T('Laps, tying and the pre-pour check','लैप, बाँधना और कंक्रीट से पहले जाँच','लॅप, बांधणे आणि काँक्रीटपूर्वी तपासणी'),
 sub:T('Tie firmly, walk on planks, get sign-off before the pour','कसकर बाँधें, तख्तों पर चलें, कंक्रीट से पहले मंज़ूरी लें','घट्ट बांधा, फळ्यांवरून चला, काँक्रीटपूर्वी मंजुरी घ्या'),
 kw:T('lap tie binding wire cross plank walk pour check sign-off approve stagger','लैप बाँधना बाइंडिंग तार क्रॉसिंग तख्ता चलना कंक्रीट जाँच मंज़ूरी','लॅप बांधणे बाइंडिंग तार क्रॉसिंग फळी चालणे काँक्रीट तपासणी मंजुरी'),
 steps:[
  {ic:'🔗',tx:T('Lap bars only where the drawing shows, for the length given. Stagger the laps.','सरियों को सिर्फ़ ड्रॉइंग में दिखी जगह और दी गई लंबाई तक जोड़ें (लैप)। लैप आगे-पीछे रखें।','सळया फक्त ड्रॉइंगमध्ये दाखवलेल्या जागी व दिलेल्या लांबीपर्यंत जोडा (लॅप). लॅप आड-उभे ठेवा.')},
  {ic:'🧵',tx:T('Tie bars firmly with binding wire at crossings so they do not shift during concreting.','क्रॉसिंग पर बाइंडिंग तार से सरिये कसकर बाँधें ताकि कंक्रीट डालते समय खिसकें नहीं।','क्रॉसिंगवर बाइंडिंग तारेने सळया घट्ट बांधा म्हणजे काँक्रीट ओतताना सरकणार नाहीत.')},
  {ic:'🚶',tx:T('Walk only on planks laid over the steel. Do not step on bars: they bend and cause slips.','सरियों के ऊपर बिछे तख्तों पर ही चलें। सरियों पर पैर न रखें: वे मुड़ते हैं और फिसलन होती है।','सळ्यांवर ठेवलेल्या फळ्यांवरूनच चला. सळ्यांवर पाय ठेवू नका: त्या वाकतात आणि घसरण होते.')},
  {ic:'✅',tx:T('Before the pour, check count, diameter, spacing, cover and ties. Get the engineer’s or supervisor’s OK.','कंक्रीट डालने से पहले संख्या, व्यास, दूरी, कवर और बंधन जाँचें। इंजीनियर या सुपरवाइज़र की मंज़ूरी लें।','काँक्रीट ओतण्यापूर्वी संख्या, व्यास, अंतर, कव्हर व बंधने तपासा. इंजिनिअर किंवा सुपरवायझरची मंजुरी घ्या.')}],
 mistake:T('Common mistake: loose ties and cut wire ends left sticking out. Bars move and people get hurt.','आम गलती: ढीली बाँधन और तार के कटे सिरे बाहर छोड़ना। सरिये खिसकते हैं और चोट लगती है।','सामान्य चूक: सैल बंधने आणि तारेची कापलेली टोके बाहेर ठेवणे. सळया सरकतात आणि इजा होते.'),

function blankProg(){return {learned:null,seen:[],attempts:0,best:0,passed:false,passedAt:null,dl:false}}
function seedWorker(id,name,trades,exp,district,lang,spec,joinedDays){
  const joined=Date.now()-joinedDays*DAY;
  const w={id,name,trades,exp,district,lang,rpl:[],prog:{},joined,synthetic:true,notif:[],lastLevel:0};
  const checks=[];
  Object.keys(spec).forEach(mid=>{
    const st=spec[mid], mo=MOD[mid], p=blankProg();
    p.learned='watched'; p.seen=[0,1,2,3]; p.dl=true;
    if(st==='L'){}
    else if(st==='F'){p.attempts=2;p.best=1}
    else{ // P or V
      p.attempts=st==='V'?1:2; p.best=3; p.passed=true; p.passedAt=joined+(mo.order*2)*DAY;
      if(st==='V') checks.push({id:'c_'+id+'_'+mid,wid:id,modId:mid,status:'verified',items:[true,true,true],photo:null,remark:'',by:APPROVER,reqAt:p.passedAt+DAY/2,doneAt:p.passedAt+2*DAY,synced:true});
    }
    w.prog[mid]=p;
  });
  return {w,checks};
}

/* level rules are defined once, here, and used everywhere (prototype thresholds: assumptions) */
function calcLevelRaw(w,st){
  const passed=Object.values(w.prog).filter(p=>p.passed).length;
  const verified=st.checks.filter(c=>c.wid===w.id&&c.status==='verified').length;
  const tips=st.tips.filter(t=>t.wid===w.id&&t.status==='approved').length;
  if(w.exp>=5&&verified>=4&&tips>=4)return 4;
  if(verified>=2&&tips>=2)return 3;
  if(verified>=1&&passed>=2)return 2;
  if(passed>=1)return 1;
  return 0;
}

/* the three verification layers stay separate states */
function layers(w,m){
  const p=w.prog[m.id]||blankProg(), c=getCheck(w.id,m.id);
  const l1=p.learned==='watched'?'done':p.learned==='rpl'?'rpl':'todo';
  const l2=p.passed?'passed':(l1!=='todo'?'todo':'locked');
  let l3='locked';
  if(c){l3=c.status==='verified'?'verified':c.status==='needs_practice'?'practice':(c.synced?'wait':'queued')}
  else if(p.passed)l3='todo';
  return {l1,l2,l3,p,c};
}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function order(mid,qi,attempt){

  m.quiz.forEach((qq,i)=>{
    const ord=order(m.id,i,q.attempt),chosen=ord[q.answers[i]],ok=chosen===0;

/* ---------- rule-based matching (transparent; NOT machine learning) ---------- */
function skillCredit(w,mid){const c=getCheck(w.id,mid),p=w.prog[mid];return c&&c.status==='verified'?1:p&&p.passed?0.6:p&&p.learned?0.2:0}
function matchOpp(w,o){
  const trade=w.trades.includes(o.trade)?40:0;
  const place=w.district===o.d?30:(DISTRICTS[w.district]&&DISTRICTS[w.district].st===DISTRICTS[o.d].st?15:0);
  const per=o.req.map(mid=>skillCredit(w,mid));
  const skills=30*(per.reduce((a,b)=>a+b,0)/per.length);
  return {total:Math.round(trade+place+skills),trade,place,skills:Math.round(skills*10)/10,per};
}
function oppsFor(w){return OPPS.map(o=>({o,m:matchOpp(w,o)})).sort((a,b)=>b.m.total-a.m.total)}
/* ---------- rule-based recommender: prerequisite + assessment gap + trade relevance (+safety-first, +opportunity gap) ---------- */
function recommend(w){
  const top=oppsFor(w)[0];
  const out=[];
  modsOf(w).forEach(m=>{
    const p=prog(w,m.id);if(p.passed)return;
    if(!prereqMet(w,m))return;
    const parts=[];
    parts.push({k:'r_prereq',pts:20});
    if(m.safety)parts.push({k:'r_safety',pts:30});
    if(p.learned&&!p.passed)parts.push({k:'r_gap',pts:25});
    if(p.attempts>0&&!p.passed)parts.push({k:'r_fail',pts:10*Math.min(p.attempts,2)});
    parts.push({k:'r_trade',pts:m.trade===w.trades[0]?10:5});
    if(top&&top.o.req.includes(m.id)&&skillCredit(w,m.id)<1&&w.trades.includes(top.o.trade))parts.push({k:'r_opp',pts:15});

const STOP=new Set('the a an is are to of and in on for how do i should what why when with my me it be can you your this that or at as by from if then'.split(' ').concat('कितनी कितना कितने कैसे क्या क्यों कब कहाँ करें करना करते करता है हैं में से का की के को और पर या ये यह वह जो तो भी ही एक कोई मैं मुझे आप'.split(' '),'कसे कसा कसी काय का कधी कुठे आहे आणि या ते हे मी मला तुम्ही करा करावे च्या ची चे मध्ये साठी ला वर'.split(' '),'kya hota hai kaise kaisa kaisi kitna kitni kyun kyu ka ki ke mein me se ko aur chahiye karo karna batao bataye mujhe'.split(' ')));
function stem(t){
  if(/^[a-z]+$/.test(t))return t.length>4?t.replace(/(ing|es|ed|s)$/,''):t;
  if(/[\u0900-\u097F]/.test(t)){const r=t.replace(/(ावा|ावे|ावी)$/,'').replace(/[\u093E-\u094D\u0901-\u0903]+$/,'');return r.length>=2?r:t}

let KB=null,DF={};
function buildKB(){
  KB=[];DF={};
  MODS.forEach(m=>{
    const kw=new Set(allLang(m.kw));
    m.steps.forEach((s,i)=>KB.push({modId:m.id,kind:'step',idx:i,t:s.tx,set:new Set(allLang(s.tx)),kw}));
    KB.push({modId:m.id,kind:'mistake',idx:0,t:m.mistake,set:new Set(allLang(m.mistake)),kw});
  });
  KB.forEach(c=>c.set.forEach(t=>DF[t]=(DF[t]||0)+1));
}
const BLOCK=[/\b(design|structural|calculat\w*|span|beam size|column size|slab thickness|how thick|remove (a |the )?(column|beam|wall)|demolish\w*|load[- ]?bearing|how many bars|how much steel)\b/i,/(डिज़ाइन|डिझाइन|भार क्षमता|लोड|कॉलम हटा|स्तंभ हटा|कितना सरिया|कितने सरिये|संरचना)/];
function ask(q){
  if(!KB)buildKB();
  const w=me();
  if(BLOCK.some(r=>r.test(q)))return {type:'block'};
  const qt=[...new Set(toks(q))];
  if(!qt.length)return {type:'refuse'};
  const N=KB.length;let scored=[];
  KB.forEach(c=>{
    const mo=MOD[c.modId];
    if(S.net==='offline'&&w&&!isDl(w,mo))return;      // offline: only downloaded content is searchable
    let sc=0,hit=0;
    qt.forEach(t=>{if(c.set.has(t)){sc+=2*Math.log(1+N/DF[t]);hit++}else if(c.kw.has(t)){sc+=0.8;hit+=0.5}});
    if(hit>0)scored.push({c,sc,hit});

  scored.sort((a,b)=>b.sc-a.sc);
  const best=scored[0];
  if(!best||best.sc<3||best.hit/qt.length<0.6)return {type:'refuse'};
  return {type:'answer',hits:scored.filter(s=>s.sc>=best.sc*0.7).slice(0,2)};
}

function loopStages(w){
 const any=Object.values(w.prog).some(p=>p.learned);
 const st=[
  {k:'loop_learn',c:'#E97132',t:'#0E2841',done:any},
  {k:'loop_demo',c:'#156082',t:'#fff',done:verifiedN(w)>0},
  {k:'loop_share',c:'#196B24',t:'#fff',done:S.tips.some(t=>t.wid===w.id&&tipVisible(t))},
  {k:'loop_profile',c:'#0F9ED5',t:'#0E2841',done:completeness(w)>=75},
  {k:'loop_work',c:'#6E6E6E',t:'#fff',done:Object.values(S.interests).some(a=>a.includes(w.id))},
  {k:'loop_grow',c:'#0E2841',t:'#fff',done:lvl(w)>=2}];
 const ci=st.findIndex(s=>!s.done);st.forEach((s,i)=>{s.cur=i===ci});return st;
}
function notifText(n){
 const mt=n.mod?modTitle(n.mod):'';
 if(n.k==='lvl')return '🎉 '+tf('n_lvl',{n:n.n,name:u('level'+n.n)});
 if(n.k==='verified')return '✅ '+tf('n_verified',{by:n.by,mod:mt});
 if(n.k==='practice')return '🔁 '+tf('n_practice',{by:n.by,mod:mt});
 if(n.k==='tipok')return '💬 '+tf('n_tipok',{mod:mt});
 if(n.k==='tiprej')return '⚠️ '+tf('n_tiprej',{mod:mt,reason:n.reason});
 return '';
}

function speak(text){
 if(!('speechSynthesis' in window)){toast(u('tts_none'));return}
 try{
  speechSynthesis.cancel();const ut=new SpeechSynthesisUtterance(text);const l=LANGS.find(x=>x.id===S.lang);ut.lang=l.tts;ut.rate=.9;
  const vs=speechSynthesis.getVoices();if(vs.length&&!vs.some(v=>v.lang&&v.lang.toLowerCase().startsWith(l.tts.slice(0,2)))){toast(u('tts_none'));return}
  ut.onstart=()=>{ui.speaking=true;render()};ut.onend=ut.onerror=()=>{ui.speaking=false;render()};speechSynthesis.speak(ut);
 }catch(e){toast(u('tts_none'))}
}

 <div style="padding:0 14px"><h2>Waiting for you (${pend.length})</h2>${pend.length?pend.map(c=>{const w=W(c.wid);return `<div class="card flat" style="margin-bottom:10px"><div class="row sb"><div><b>${esc(w.name)}</b> ${lvChip(lvl(w))}<div class="muted">${MOD[c.modId].ic} ${modTitle(c.modId)} · requested ${fmtD(c.reqAt)}${c.photo?' · 📷 photo':''}</div></div>${B('Review →','sup_open',{a:c.id,c:'primary sm'})}</div></div>`}).join(''):`<div class="card flat">No requests waiting. Ask a worker to pass a knowledge check and request a check.</div>`}

function supMod(){

 else b=`<div class="card"><h3>Three experience moments</h3><p class="muted">Each takes about two minutes. Use “Reset demo” between attempts.</p>
 <div class="card hi flat" style="margin-bottom:12px"><h3>1 · A wrong answer really gates progress</h3><ol style="padding-left:20px;margin:0 0 8px"><li>New learner → fill demo details → Start learning.</li><li>Open “Working safely at height”, step through the 4 steps, tap Finish learning.</li><li>Start the check and answer wrongly. It does not pass. Retry and pass.</li><li>The supervisor check unlocks as a separate, later step. Request it, then switch to Supervisor to sign off.</li></ol>${B('Start moment 1','moment',{a:1,c:'primary sm'})}</div>
 <div class="card hi flat" style="margin-bottom:12px"><h3>2 · The Level-0 gate opens only when earned</h3><ol style="padding-left:20px;margin:0 0 8px"><li>As a new learner, open Share and tap “Post a tip”. It is blocked, with reasons.</li><li>Pass a knowledge check (moment 1), return and post. It waits for moderation. Approve it as Supervisor.</li><li>Compare with the Contributor (L3) persona, whose tips go live at once.</li></ol>${B('Start moment 2','moment',{a:2,c:'primary sm'})}</div>
 <div class="card hi flat"><h3>3 · Not “Skill India for construction”</h3><p style="margin:0 0 8px">Open the Positioning tab and read the dossier’s own e-Shram / SIDH / CSDCI / PMKVY table.</p>${B('Open the table','moment',{a:3,c:'primary sm'})}</div></div>
 <div class="card"><h3>Also try</h3><p>Toggle ✈️ Offline and try a module you have not downloaded. Do a check offline, then go online and watch the queue sync. Switch language. Turn on ☀️ sunlight mode. Ask Setu a design question and watch it refuse. Change your place in Work and see the match move.</p>${B('↺ Reset demo data','reset',{c:'sm'})}</div>`;
 return head+b;
}

/* ===== main: render, events, init ===== */
function main(){
 if(ui.about)return aboutView();
 const p=S.persona;
 if(p==='supervisor'){if(!['checks','mod'].includes(ui.view.tab))ui.view={tab:'checks'};return supView()}
 if(p==='agency'){if(!['overview','workers'].includes(ui.view.tab))ui.view={tab:'overview'};return agencyView()}
 const w=me();if(!w)return registerView();
 if(!['learn','share','passport','work'].includes(ui.view.tab))ui.view={tab:'learn',sub:'home'};
 const t=ui.view.tab;let h;
 if(t==='learn'){h=(ui.view.sub==='module'&&MOD[ui.view.id])?modView(w,MOD[ui.view.id]):ui.view.sub==='assist'?assistView(w):learnHome(w)}
 else if(t==='share')h=shareView(w);else if(t==='passport')h=passportView(w,false);else h=workView(w);
 return h+gateModal(w);
}
function render(){
 const app=document.getElementById('app'),y=window.scrollY;
 try{
  document.body.classList.toggle('hc',!!S.hc);document.documentElement.lang=S.lang;
  app.innerHTML=topbar()+personaBar()+whoBar()+'<main id="main">'+main()+'</main>'+tabbar();
 }catch(e){
  console.error(e);
  app.innerHTML=`<div class="card bad"><h2>Something went wrong</h2><p>Your data is safe. Reset the demo to continue.</p>${B('↺ Reset demo data','reset',{c:'primary'})}</div>`;
 }
 if(ui.top){window.scrollTo(0,0);ui.top=false}else window.scrollTo(0,y);
}
function setPersona(p){
 stopSpeak();S.persona=p;ui.about=null;ui.quiz=null;ui.check=null;ui.viewWorker=null;ui.gate=null;ui.composing=false;
 ui.view=p==='supervisor'?{tab:'checks'}:p==='agency'?{tab:'overview'}:{tab:'learn',sub:'home'};
 save();ui.top=true;render();
}
function defaultLayer(w,m){const L=layers(w,m);return L.l1==='todo'?1:L.l2!=='passed'?2:3}
function handlePhoto(file){
 if(!file)return;if(!file.type||!file.type.startsWith('image/')){toast('Please choose an image file.');return}
 if(file.size>15*1024*1024){toast('That photo is too large (15 MB max).');return}
 const fr=new FileReader();
 fr.onload=()=>{const img=new Image();img.onload=()=>{try{const s=Math.min(1,560/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);ui.photo=cv.toDataURL('image/jpeg',.6);render()}catch(e){toast('Could not read that photo.')}};img.onerror=()=>toast('Could not read that photo.');img.src=fr.result};
 fr.readAsDataURL(file);
}
function downloadPassport(id){const w=W(id);if(!w)return;const blob=new Blob([JSON.stringify(passportObj(w),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kaushalsetu-passport-'+ppId(w)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function copySummary(id){
 const w=W(id);if(!w)return;const o=passportObj(w);
 const txt=`KaushalSetu passport ${ppId(w)} (prototype)\n${o.worker.name} · ${o.worker.trades.join('/')} · ${o.worker.experience_years} yrs · ${o.worker.district}\nLevel ${o.worker.level} ${o.worker.level_name}\n`+o.modules.map(m=>`- ${m.module}: learn ${m.learning_completion}, check ${m.knowledge_assessment}, demo ${m.capability_demonstration}`).join('\n');
 const done=()=>toast(u('pp_copied'));
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>fb());else fb();
 function fb(){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){toast('Copy not available')}t.remove()}
}
const H={
 lang:(el,a)=>{S.lang=a;ui.reg.lang=a;stopSpeak();save();render()},
 hc:()=>{S.hc=!S.hc;save();render()},
 net:()=>setNet(S.net==='online'?'offline':'online'),
 about:(el,a)=>{ui.about=a||'how';ui.top=true;render()},
 about_tab:(el,a)=>{ui.about=a;ui.top=true;render()},
 about_close:()=>{ui.about=null;ui.top=true;render()},
 moment:(el,a)=>{if(a==='3'){ui.about='position';ui.top=true;render();return}S.persona='learner';ui.about=null;ui.view={tab:a==='2'?'share':'learn',sub:'home'};save();ui.top=true;render()},
 persona:(el,a)=>setPersona(a),
 tab:(el,a)=>{stopSpeak();ui.about=null;ui.quiz=null;ui.check=null;ui.viewWorker=null;ui.view={tab:a,sub:'home'};ui.top=true;render()},
 reset:()=>{resetAll();toast('Demo reset');ui.top=true;render()},
 reg_trade:(el,a)=>{ui.reg.trade=a;ui.reg.rpl=[];render()},
 reg_exp:(el,a)=>{ui.reg.exp=Math.max(0,Math.min(40,ui.reg.exp+ +a));render()},
 reg_rpl:(el,a)=>{const r=ui.reg.rpl,i=r.indexOf(a);if(i>=0)r.splice(i,1);else r.push(a);render()},
 reg_demo:()=>{ui.reg={name:'Ramesh Yadav',trade:'mason',lang:S.lang,exp:2,dist:'pune',rpl:[]};render()},
 reg_go:()=>{
  const r=ui.reg,err={};if(!r.name||r.name.trim().length<2)err.name=1;if(!r.trade)err.trade=1;if(!r.dist)err.dist=1;
  if(Object.keys(err).length){r.err=err;render();return}
  r.err=null;const id='w_me';
  S.workers[id]={id,name:r.name.trim(),trades:[r.trade],exp:r.exp,district:r.dist,lang:S.lang,rpl:r.rpl.slice(),prog:{},joined:Date.now(),notif:[],lastLevel:0,synthetic:false};
  S.meId=id;ui.view={tab:'learn',sub:'home'};save();ui.top=true;render();
 },
 clear_notif:()=>{const w=me();if(w){w.notif=[];save();render()}},
 dl:(el,a)=>startDl(a),dl_all:()=>dlAll(),
 add_trade:(el,a)=>{const w=me();if(w&&!w.trades.includes(a)){w.trades.push(a);save();render()}},
 open_mod:(el,a)=>{
  const w=me(),m=MOD[a];if(!w||!m)return;
  if(!w.trades.includes(m.trade))w.trades.push(m.trade);
  const ac=access(w,m);if(!ac.ok){toast(ac.why==='prereq'?tf('prereq_lock',{m:modTitle(m.prereq)}):u('dl_offline_block'));return}
  ui.about=null;ui.quiz=null;ui.view={tab:'learn',sub:'module',id:a,layer:defaultLayer(w,m),step:0};markSeen(a,0);ui.top=true;render();
 },
 mod_close:()=>{stopSpeak();ui.quiz=null;ui.view={tab:'learn',sub:'home'};ui.top=true;render()},
 layer:(el,a)=>{stopSpeak();ui.view.layer=+a;if(+a===1&&ui.view.step==null)ui.view.step=0;ui.top=true;render()},
 step_next:()=>{stopSpeak();const m=MOD[ui.view.id],w=me();ui.view.step=Math.min(m.steps.length-1,(ui.view.step||0)+1);markSeen(m.id,ui.view.step);render()},
 step_back:()=>{stopSpeak();ui.view.step=Math.max(0,(ui.view.step||0)-1);render()},
 listen:()=>{const m=MOD[ui.view.id],i=ui.view.step||0;speak(tx(m.steps[i].tx)+(i===m.steps.length-1?' . '+tx(m.mistake):''))},
 stop:()=>{stopSpeak();render()},
 finish:()=>{if(finishLearning(ui.view.id)){toast('✓ '+u('layer1'));render()}else toast(u('quiz_locked'))},
 rpl_skip:(el,a)=>{if(rplSkip(a)){ui.view.layer=2;ui.top=true;render()}},
 quiz_start:()=>{startQuiz(ui.view.id);ui.top=true;render()},
 quiz_retry:()=>{startQuiz(ui.view.id);ui.top=true;render()},
 review_steps:()=>{ui.quiz=null;ui.view.layer=1;ui.view.step=0;ui.top=true;render()},
 ans:(el)=>{ui.quiz.answers[+el.dataset.q]=+el.dataset.a;render()},
 quiz_submit:()=>{submitQuiz();ui.top=true;render()},
 after_pass:()=>{ui.quiz=null;ui.view.layer=3;ui.top=true;render()},
 photo_rm:()=>{ui.photo=null;render()},
 req_check:(el,a)=>{if(requestCheck(a)){toast(S.net==='offline'?u('req_queued'):u('req_wait'));render()}},
 tip_open:()=>{const w=me(),g=tipGate(w);if(!g.allowed){ui.gate={...g,mid:null};render();return}ui.composing=true;render()},
 tip_cancel:()=>{ui.composing=false;render()},
 tip_send:()=>{
  const d=ui.tipDraft;d.err=null;
  if(!d.mod){d.err=u('sel_mod');render();return}
  const res=postTip(d.mod,d.text);
  if(res.ok){toast(res.tip.mode==='post'?u('tip_sent_post'):u('tip_sent_pre'));ui.tipDraft={mod:'',text:''};ui.composing=false;ui.tipFilter='mine'}
  else if(res.k==='gate'){ui.gate={...res.gate,mid:d.mod}}
  else d.err=u(res.k);
  render();
 },
 gate_close:()=>{ui.gate=null;render()},
 gate_close_bg:(el,a,e)=>{if(e.target===el){ui.gate=null;render()}},
 gate_go:()=>{ui.gate=null;ui.view={tab:'learn',sub:'home'};ui.top=true;render()},
 tipfilter:(el,a)=>{ui.tipFilter=a;render()},
 helpful:(el,a)=>{toggleHelpful(a);render()},
 report:(el,a)=>{reportTip(a);toast(u('reported'));render()},
 pp_dl:(el,a)=>downloadPassport(a),pp_copy:(el,a)=>copySummary(a),
 interest:(el,a)=>{const l=S.interests[a]||(S.interests[a]=[]),w=me(),i=l.indexOf(w.id);if(i>=0)l.splice(i,1);else l.push(w.id);save();render()},
 assist_open:()=>{ui.view={tab:'learn',sub:'assist'};ui.top=true;render()},
 assist_close:()=>{ui.view={tab:'learn',sub:'home'};ui.top=true;render()},
 ask_go:()=>{const q=(document.getElementById('aq')||{}).value||'';if(!q.trim())return;ui.assist.unshift({q:q.trim(),res:ask(q)});render()},
 sugg:(el,a)=>{const q=SUGG[S.lang][+a];ui.assist.unshift({q,res:ask(q)});render()},
 sup_open:(el,a)=>{ui.check=a;ui.supRemark='';ui.top=true;render()},
 sup_back:()=>{ui.check=null;ui.top=true;render()},
 sup_tick:(el,a)=>{const c=S.checks.find(x=>x.id===a);if(c){c.items[+el.dataset.i]=!c.items[+el.dataset.i];save();render()}},
 sup_sign:(el,a)=>{const c=S.checks.find(x=>x.id===a);if(!c)return;if(!c.items.every(Boolean)){toast('Tick all three observed items first.');return}if(signOff(a)){toast('✅ Verified. '+esc(W(c.wid).name)+' is notified.');ui.check=null;ui.top=true;render()}},
 sup_practice:(el,a)=>{if(sendBack(a,ui.supRemark||'')){toast('Sent back with your remark.');ui.check=null;ui.top=true;render()}else toast('Add a short remark (4+ characters) so the worker knows what to practise.')},
 mod_keep:(el,a)=>{modKeep(a);toast('Kept');render()},
 mod_rej:(el,a)=>{const p=a.split('|');modReject(p[0],p[1]);toast('Rejected: '+p[1]);render()},
 vw_open:(el,a)=>{ui.viewWorker=a;ui.top=true;render()},vw_close:()=>{ui.viewWorker=null;ui.top=true;render()},
};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 const f=H[el.dataset.act];if(!f)return;
 try{f(el,el.dataset.a,e)}catch(err){console.error(err);toast('Something went wrong. Your progress is kept.')}
});
function onIn(e){
 const el=e.target,k=el.dataset&&el.dataset.in;if(!k)return;const v=el.value;
 if(k==='reg_name')ui.reg.name=v;
 else if(k==='reg_dist'){ui.reg.dist=v}
 else if(k==='tip_mod'){ui.tipDraft.mod=v;ui.tipDraft.err=null}
 else if(k==='tip_text'){ui.tipDraft.text=v;ui.tipDraft.err=null;const c=document.getElementById('cc');if(c)c.textContent=v.length+'/280'}
 else if(k==='w_dist'&&e.type==='change'){const w=me();if(w){w.district=v;save();render()}}
 else if(k==='sup_remark')ui.supRemark=v;
 else if(k==='a_trade'&&e.type==='change'){ui.aFilter=Object.assign({},ui.aFilter,{trade:v});render()}
 else if(k==='a_dist'&&e.type==='change'){ui.aFilter=Object.assign({},ui.aFilter,{dist:v});render()}
 else if(k==='photo'&&e.type==='change')handlePhoto(el.files&&el.files[0]);
}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='aq'){e.preventDefault();H.ask_go()}if(e.key==='Escape'&&ui.gate){ui.gate=null;render()}});
/* init */
S=load();S.net=S.net||'online';ui.reg.lang=S.lang;
if(S.persona==='learner'&&S.meId&&!S.workers[S.meId])S.meId=null;
buildKB();
Object.values(S.workers).forEach(w=>Object.values(w.prog).forEach(p=>{}));
render();
if(S.net==='online'&&S.queue.length)syncNow();


</script></body></html>
